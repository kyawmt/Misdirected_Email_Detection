[project]
name = "med-data"
version = "0.4.0"
description = "Fictional data, features, and model comparison for misdirected email detection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
med-data = "med_data.cli:main"
med-features = "med_features.cli:main"
med-models = "med_models.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
