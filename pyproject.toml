[project]
name = "med-data"
version = "0.7.0"
description = "Fictional data, features, model comparison, warning policy, scoring API, and simulated review UI for misdirected email detection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
ui = [
    "streamlit>=1.40",
    "httpx>=0.27",
]

[project.scripts]
med-data = "med_data.cli:main"
med-features = "med_features.cli:main"
med-models = "med_models.cli:main"
med-policy = "med_policy.cli:main"
med-api = "med_api.cli:main"
med-ui = "med_ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
